# AE Tracker with its own MariaDB (MySQL-compatible) database, instead of SQLite.
#
#   docker compose -f docker-compose.mariadb.yml up -d
#
# Change the two passwords below before the first start. MariaDB's data is kept in ./mariadb and
# the tracker's app key in ./data - back both up. Needs a 64-bit OS on the Pi (MariaDB has no
# 32-bit ARM image).
services:
  aetracker:
    image: ghcr.io/mxr156/aetracker:latest
    container_name: aetracker
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"          # open http://<your-pi>:8080
    volumes:
      - ./data:/data       # app key (and somewhere to put a SQLite file to copy in)
    environment:
      APP_URL: "http://raspberrypi.local:8080"
      APP_TIMEZONE: "Europe/London"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: aetracker
      DB_USERNAME: aetracker
      DB_PASSWORD: "change-me"

  db:
    image: mariadb:11
    container_name: aetracker-db
    restart: unless-stopped
    volumes:
      - ./mariadb:/var/lib/mysql
    environment:
      MARIADB_DATABASE: aetracker
      MARIADB_USER: aetracker
      MARIADB_PASSWORD: "change-me"
      MARIADB_ROOT_PASSWORD: "change-me-too"
